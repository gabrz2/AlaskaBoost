name: Build AlaskaBoost APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair o projeto do zip
        run: unzip -q -o AlaskaBoost.zip

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK
        working-directory: AlaskaBoost
        run: gradle assembleDebug --no-daemon

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaskaBoost-apk
          path: AlaskaBoost/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
